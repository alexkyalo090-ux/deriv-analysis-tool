<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deriv Analysis Tool Pro</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background: #0e021f;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        .dashboard-card {
            width: 100%;
            max-width: 440px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            padding: 22px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
            color: #ffffff;
            text-align: center;
        }

        h2.title {
            color: #c084fc;
            font-size: 21px;
            font-weight: 900;
            margin-bottom: 20px;
            letter-spacing: -0.5px;
        }

        .control-panel {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(168, 85, 247, 0.2);
            border-radius: 20px;
            padding: 18px;
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .input-group {
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            color: #c084fc;
            margin-bottom: 5px;
            padding-left: 2px;
        }

        .input-group select {
            width: 100%;
            background: #090514;
            border: 1px solid #6b21a8;
            border-radius: 12px;
            padding: 14px;
            font-size: 14px;
            color: #f3f4f6;
            font-weight: 600;
            outline: none;
        }

        .live-tracker {
            background: rgba(107, 33, 168, 0.2);
            border: 1px solid rgba(168, 85, 247, 0.25);
            border-radius: 16px;
            padding: 14px;
        }

        #live-tick {
            font-size: 38px;
            font-weight: 900;
            color: #e9d5ff;
            letter-spacing: -1px;
        }

        .tracker-subtext {
            font-size: 10px;
            color: #94a3b8;
            margin-top: 4px;
        }

        #start-btn {
            width: 100%;
            background: #7e22ce;
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            padding: 14px;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .results-panel {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(168, 85, 247, 0.15);
            border-radius: 20px;
            padding: 18px;
        }

        .panel-title {
            font-size: 11px;
            font-weight: 700;
            color: #a78bfa;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        #prediction-digit {
            font-size: 34px;
            font-weight: 900;
            color: #f59e0b;
            margin-top: 8px;
            margin-bottom: 2px;
            transition: all 0.3s ease;
        }

        .live-countdown-line {
            font-size: 14px;
            font-weight: bold;
            color: #f59e0b;
            margin-bottom: 10px;
        }

        .strategy-tag {
            font-size: 11px;
            color: #64748b;
            margin-bottom: 12px;
        }

        .matrix-list {
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            font-size: 12px;
            font-weight: 700;
            color: #cbd5e1;
            text-align: left;
        }

        .matrix-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .bar-container {
            width: 100px;
            background: #020105;
            height: 6px;
            border-radius: 99px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        #confidence-bar {
            width: 0%;
            height: 100%;
            background: #ef4444;
            transition: width 0.3s ease;
        }

        .value-highlight {
            color: #f1f5f9;
            font-weight: 900;
        }

        .analysis-footer {
            margin-top: 14px;
            background: rgba(168, 85, 247, 0.08);
            border: 1px solid rgba(168, 85, 247, 0.12);
            border-radius: 12px;
            padding: 10px;
            font-size: 11px;
            color: #94a3b8;
        }

        #analysis-text {
            font-style: italic;
            color: #e2e8f0;
        }

        .hidden {
            display: none !important;
        }

        .mode-badge {
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 10px;
            font-weight: 700;
            margin-bottom: 10px;
            text-align: center;
            animation: pulse 2s infinite;
        }

        .simulated-badge {
            background: rgba(59, 130, 246, 0.2);
            border: 1px solid #3b82f6;
            color: #93c5fd;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
    </style>

</head>
<body>
    <div class="dashboard-card">
        <h2 class="title">Deriv Analysis Tool Pro</h2>
        <div id="mode-badge" class="mode-badge simulated-badge">🎮 SIMULATED DATA</div>

        <div class="control-panel">
            <div class="input-group">
                <label>📊 Asset:</label>
                <select id="asset">
                    <option value="R_10">Volatility 10 Index</option>
                    <option value="R_25">Volatility 25 Index</option>
                    <option value="R_50">Volatility 50 Index</option>
                    <option value="R_75">Volatility 75 Index</option>
                    <option value="R_100">Volatility 100 Index</option>
                </select>
            </div>

            <div class="input-group">
                <label>🕒 Strategy:</label>
                <select id="strategy">
                    <option value="matches">Matches</option>
                    <option value="differs">Differs</option>
                    <option value="even_odd">Even / Odd</option>
                    <option value="over_under">Over / Under 5</option>
                    <option value="rise_fall">Rise / Fall</option>
                </select>
            </div>

            <div class="live-tracker">
                <div id="live-tick">0000.00</div>
                <div class="tracker-subtext">
                    Last update: <span id="live-time">00:00:00</span> | Ticks: <span id="tick-count">0</span>
                </div>
            </div>

            <button id="start-btn">Start Analysis</button>
        </div>

        <div id="result-box" class="results-panel hidden">
            <p id="prediction-title" class="panel-title">🎯 Prediction View</p>
            <h1 id="prediction-digit">Initializing...</h1>

            <div class="live-countdown-line">
                <span id="countdown-label">Analysis Phase:</span> <span id="countdown-timer">20s</span>
            </div>

            <p id="strategy-label" class="strategy-tag">Matches Strategy</p>

            <div class="matrix-list">
                <div class="matrix-row">
                    <span>Confidence: <span id="confidence-txt" style="color: #ef4444;">0%</span></span>
                    <div class="bar-container">
                        <div id="confidence-bar"></div>
                    </div>
                </div>
                <div class="matrix-row">
                    <span>Recommended Runs:</span>
                    <span id="recommended-runs" class="value-highlight">...</span>
                </div>
            </div>

            <div class="analysis-footer">
                Analysis: <span id="analysis-text">✅ Connected! Generating market data...</span>
            </div>
        </div>
    </div>

    <script>
        let tickHistory = [];
        let cycleCount = 0;
        let tickSimInterval = null;
        let basePrice = 1234.56;

        const startBtn = document.getElementById('start-btn');
        const assetSelect = document.getElementById('asset');
        const strategySelect = document.getElementById('strategy');
        const liveTickDisp = document.getElementById('live-tick');
        const liveTimeDisp = document.getElementById('live-time');
        const tickCountDisp = document.getElementById('tick-count');
        const resultBox = document.getElementById('result-box');
        const modeBadge = document.getElementById('mode-badge');

        const predTitle = document.getElementById('prediction-title');
        const predDigitDisp = document.getElementById('prediction-digit');
        const strategyLabel = document.getElementById('strategy-label');
        const confidenceTxt = document.getElementById('confidence-txt');
        const confidenceBar = document.getElementById('confidence-bar');
        const recommendedRunsDisp = document.getElementById('recommended-runs');
        const countdownTimer = document.getElementById('countdown-timer');
        const countdownLabel = document.getElementById('countdown-label');
        const analysisText = document.getElementById('analysis-text');

        let countdownValue = 20;
        let phase = 'analysis';
        let countdownInterval = null;

        strategySelect.addEventListener('change', () => {
            const activeText = strategySelect.options[strategySelect.selectedIndex].text;
            strategyLabel.innerText = activeText + " Strategy";
            predTitle.innerText = "🎯 " + activeText + " Prediction";
        });

        startBtn.addEventListener('click', () => {
            startAnalysis();
        });

        function startAnalysis() {
            startBtn.disabled = true;
            startBtn.innerText = "Analyzing...";
            resultBox.classList.remove('hidden');
            tickHistory = [];
            cycleCount = 0;
            phase = 'analysis';
            countdownValue = 20;
            modeBadge.innerText = '🎮 SIMULATED DATA - CONNECTED';
            
            // Start generating ticks IMMEDIATELY
            if (tickSimInterval) clearInterval(tickSimInterval);
            tickSimInterval = setInterval(() => {
                const change = (Math.random() - 0.5) * 0.1;
                basePrice += change;
                const lastDigit = Math.floor(basePrice) % 10;
                tickHistory.push(lastDigit);
                if (tickHistory.length > 1000) tickHistory.shift();

                liveTickDisp.innerText = basePrice.toFixed(2);
                const now = new Date();
                liveTimeDisp.innerText = now.toTimeString().split(' ')[0];
                tickCountDisp.innerText = tickHistory.length;
            }, 50);

            // Start countdown IMMEDIATELY
            updateCountdown();
        }

        function updateCountdown() {
            if (countdownInterval) clearInterval(countdownInterval);

            countdownInterval = setInterval(() => {
                countdownValue--;
                countdownTimer.innerText = `${countdownValue}s`;

                if (countdownValue <= 0) {
                    clearInterval(countdownInterval);
                    countdownInterval = null;

                    if (phase === 'analysis') {
                        phase = 'validation';
                        cycleCount++;
                        countdownLabel.innerText = `Cycle #${cycleCount}:`;
                        countdownValue = 15;
                        generatePrediction();
                        updateCountdown();
                    } else {
                        countdownValue = 15;
                        generatePrediction();
                        updateCountdown();
                    }
                }
            }, 1000);
        }

        function generatePrediction() {
            if (tickHistory.length < 10) {
                predDigitDisp.innerText = "Waiting...";
                return;
            }

            const strategy = strategySelect.value;
            const recentTicks = tickHistory.slice(-100);
            const digitFrequency = Array(10).fill(0);

            recentTicks.forEach(digit => {
                digitFrequency[digit]++;
            });

            let prediction = '';
            let confidence = 0;
            let recommendation = 5;

            if (strategy === 'matches') {
                const maxFreq = Math.max(...digitFrequency);
                const mostCommon = digitFrequency.indexOf(maxFreq);
                prediction = `Digit ${mostCommon}`;
                confidence = Math.round((maxFreq / recentTicks.length) * 100);
                recommendation = confidence > 60 ? 3 : 7;
            }
            else if (strategy === 'differs') {
                const minFreq = Math.min(...digitFrequency);
                const leastCommon = digitFrequency.indexOf(minFreq);
                prediction = `Digit ${leastCommon}`;
                confidence = Math.round(100 - (minFreq / recentTicks.length) * 100);
                recommendation = 2;
            }
            else if (strategy === 'even_odd') {
                const evenCount = recentTicks.filter(d => d % 2 === 0).length;
                const evenPercent = Math.round((evenCount / recentTicks.length) * 100);
                prediction = evenPercent > 50 ? 'EVEN' : 'ODD';
                confidence = Math.max(evenPercent, 100 - evenPercent);
                recommendation = 6;
            }
            else if (strategy === 'over_under') {
                const overFive = recentTicks.filter(d => d > 5).length;
                const overPercent = Math.round((overFive / recentTicks.length) * 100);
                prediction = overPercent > 50 ? 'OVER 5' : 'UNDER 5';
                confidence = Math.max(overPercent, 100 - overPercent);
                recommendation = 5;
            }
            else if (strategy === 'rise_fall') {
                let riseCount = 0;
                for (let i = 1; i < recentTicks.length; i++) {
                    if (recentTicks[i] > recentTicks[i-1]) riseCount++;
                }
                const risePercent = Math.round((riseCount / (recentTicks.length - 1)) * 100);
                prediction = risePercent > 50 ? 'RISE 📈' : 'FALL 📉';
                confidence = Math.max(risePercent, 100 - risePercent);
                recommendation = 4;
            }

            predDigitDisp.innerText = prediction;
            predDigitDisp.style.color = confidence > 60 ? '#10b981' : '#f59e0b';
            confidenceTxt.innerText = `${confidence}%`;
            confidenceTxt.style.color = confidence > 60 ? '#10b981' : '#ef4444';
            confidenceBar.style.width = `${confidence}%`;
            confidenceBar.style.backgroundColor = confidence > 60 ? '#10b981' : '#ef4444';
            recommendedRunsDisp.innerText = recommendation;

            if (confidence > 60) {
                analysisText.innerText = `✅ Strong signal detected!`;
            } else {
                analysisText.innerText = `⚠️ Moderate signal - Exercise caution.`;
            }
        }
    </script>

</body>
</html>
