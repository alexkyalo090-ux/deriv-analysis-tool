<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deriv Analysis Tool Pro</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background: #0e021f;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        .dashboard-card {
            width: 100%;
            max-width: 520px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 28px;
            padding: 25px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
            color: #ffffff;
            text-align: center;
        }

        h2.title {
            color: #c084fc;
            font-size: 24px;
            font-weight: 900;
            margin-bottom: 20px;
        }

        .auth-section {
            background: rgba(107, 33, 168, 0.2);
            border: 1px solid rgba(168, 85, 247, 0.4);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 12px;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: #c084fc;
            margin-bottom: 6px;
        }

        .input-group input,
        .input-group select {
            width: 100%;
            background: #090514;
            border: 1px solid #6b21a8;
            border-radius: 12px;
            padding: 12px;
            font-size: 13px;
            color: #f3f4f6;
            font-weight: 500;
            outline: none;
        }

        .input-group input::placeholder {
            color: #64748b;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        #auth-btn {
            background: #10b981;
            color: white;
            margin-bottom: 10px;
        }

        #auth-btn:disabled {
            opacity: 0.6;
        }

        .status {
            font-size: 11px;
            padding: 8px;
            border-radius: 8px;
            margin-top: 10px;
        }

        .status.success {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
            border: 1px solid #10b981;
        }

        .status.error {
            background: rgba(239, 68, 68, 0.2);
            color: #ef4444;
            border: 1px solid #ef4444;
        }

        .control-panel {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(168, 85, 247, 0.2);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .live-tracker {
            background: rgba(107, 33, 168, 0.2);
            border: 1px solid rgba(168, 85, 247, 0.25);
            border-radius: 16px;
            padding: 14px;
            margin-bottom: 16px;
        }

        #live-tick {
            font-size: 38px;
            font-weight: 900;
            color: #e9d5ff;
        }

        .tracker-subtext {
            font-size: 10px;
            color: #94a3b8;
            margin-top: 4px;
        }

        #start-btn {
            background: #7e22ce;
            color: white;
        }

        #start-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .results-panel {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(168, 85, 247, 0.15);
            border-radius: 20px;
            padding: 18px;
        }

        .hidden {
            display: none !important;
        }

        #prediction-digit {
            font-size: 48px;
            font-weight: 900;
            color: #f59e0b;
            margin: 15px 0;
        }

        .info-text {
            font-size: 10px;
            color: #94a3b8;
            margin-top: 10px;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="dashboard-card">
        <h2 class="title">🚀 Deriv Analysis Tool</h2>

        <!-- Authentication Section -->
        <div class="auth-section">
            <div class="input-group">
                <label>🔑 Deriv API Token:</label>
                <input type="text" id="api-token" placeholder="Paste your API token here">
            </div>
            <button id="auth-btn">✅ Authenticate</button>
            <div id="auth-status" class="status error">Not Authenticated</div>
            <div class="info-text">Get token at: <strong>Deriv.com → Account Settings → API Tokens</strong></div>
        </div>

        <!-- Trading Section -->
        <div class="control-panel">
            <div class="input-group">
                <label>📊 Asset:</label>
                <select id="asset" disabled>
                    <option value="R_10">Volatility 10</option>
                    <option value="R_25">Volatility 25</option>
                    <option value="R_50">Volatility 50</option>
                    <option value="R_100">Volatility 100</option>
                </select>
            </div>

            <div class="input-group">
                <label>🎯 Strategy:</label>
                <select id="strategy" disabled>
                    <option value="matches">Matches</option>
                    <option value="differs">Differs</option>
                    <option value="even_odd">Even/Odd</option>
                    <option value="over_under">Over/Under 5</option>
                </select>
            </div>

            <div class="live-tracker">
                <div id="live-tick">0000.00</div>
                <div class="tracker-subtext">Ticks: <span id="tick-count">0</span></div>
            </div>

            <button id="start-btn" disabled>▶️ Connect</button>
        </div>

        <!-- Results Section -->
        <div id="result-box" class="results-panel hidden">
            <h3 style="color: #a78bfa; margin-bottom: 10px;">📈 PREDICTION</h3>
            <div id="prediction-digit">--</div>
            <div style="font-size: 12px; color: #cbd5e1; margin-bottom: 15px;">
                Confidence: <span id="confidence-txt" style="color: #10b981; font-weight: 900;">0%</span>
            </div>
            <div id="analysis-text" style="font-size: 11px; color: #94a3b8; font-style: italic;">Analyzing...</div>
        </div>
    </div>

    <script>
        let ws = null;
        let tickHistory = [];
        let isAuth = false;
        let token = localStorage.getItem('deriv_token') || '';

        const authBtn = document.getElementById('auth-btn');
        const authInput = document.getElementById('api-token');
        const authStatus = document.getElementById('auth-status');
        const startBtn = document.getElementById('start-btn');
        const assetSelect = document.getElementById('asset');
        const strategySelect = document.getElementById('strategy');
        const liveTickDisp = document.getElementById('live-tick');
        const tickCountDisp = document.getElementById('tick-count');
        const resultBox = document.getElementById('result-box');
        const predDigitDisp = document.getElementById('prediction-digit');
        const confidenceTxt = document.getElementById('confidence-txt');
        const analysisText = document.getElementById('analysis-text');

        if (token) authInput.value = token;

        authBtn.addEventListener('click', () => {
            const t = authInput.value.trim();
            if (!t) {
                alert('Please enter your API token');
                return;
            }
            authenticate(t);
        });

        function authenticate(apiToken) {
            authBtn.disabled = true;
            authBtn.innerText = '⏳ Validating...';
            authStatus.innerText = '⏳ Checking token...';
            authStatus.className = 'status error';

            const testWs = new WebSocket('wss://ws.binaryws.com/websockets/v3?app_id=1089');

            testWs.onopen = () => {
                testWs.send(JSON.stringify({ authorize: apiToken }));
            };

            testWs.onmessage = (e) => {
                const data = JSON.parse(e.data);
                if (data.authorize) {
                    isAuth = true;
                    token = apiToken;
                    localStorage.setItem('deriv_token', apiToken);
                    authStatus.innerText = '✅ Authenticated!';
                    authStatus.className = 'status success';
                    authBtn.innerText = '✅ Done';
                    authBtn.disabled = true;
                    authInput.disabled = true;
                    assetSelect.disabled = false;
                    strategySelect.disabled = false;
                    startBtn.disabled = false;
                    testWs.close();
                } else if (data.error) {
                    authStatus.innerText = '❌ Invalid Token';
                    authStatus.className = 'status error';
                    authBtn.innerText = '✅ Authenticate';
                    authBtn.disabled = false;
                    localStorage.removeItem('deriv_token');
                    testWs.close();
                }
            };

            testWs.onerror = () => {
                authStatus.innerText = '❌ Connection Error';
                authStatus.className = 'status error';
                authBtn.innerText = '✅ Authenticate';
                authBtn.disabled = false;
            };
        }

        startBtn.addEventListener('click', () => {
            if (!isAuth) return;
            connect();
        });

        function connect() {
            startBtn.disabled = true;
            startBtn.innerText = '⏳ Connecting...';
            resultBox.classList.remove('hidden');
            analysisText.innerText = '🔗 Connecting to Deriv...';

            ws = new WebSocket('wss://ws.binaryws.com/websockets/v3?app_id=1089');

            ws.onopen = () => {
                ws.send(JSON.stringify({ authorize: token }));
                setTimeout(() => {
                    ws.send(JSON.stringify({
                        ticks: assetSelect.value,
                        subscribe: 1
                    }));
                }, 500);
                analysisText.innerText = '✅ Connected!';
            };

            ws.onmessage = (e) => {
                const data = JSON.parse(e.data);
                if (data.tick) {
                    const digit = Math.floor(data.tick.quote) % 10;
                    tickHistory.push(digit);
                    if (tickHistory.length > 100) tickHistory.shift();
                    liveTickDisp.innerText = data.tick.quote.toFixed(2);
                    tickCountDisp.innerText = tickHistory.length;
                    analyzePrediction();
                }
            };

            ws.onerror = () => {
                analysisText.innerText = '❌ Connection Failed';
                startBtn.disabled = false;
                startBtn.innerText = '▶️ Retry';
            };
        }

        function analyzePrediction() {
            if (tickHistory.length < 10) return;

            const strategy = strategySelect.value;
            const recent = tickHistory.slice(-50);
            const freq = Array(10).fill(0);
            recent.forEach(d => freq[d]++);

            let pred = '--';
            let conf = 0;

            if (strategy === 'matches') {
                const max = Math.max(...freq);
                const idx = freq.indexOf(max);
                pred = `Digit ${idx}`;
                conf = Math.round((max / recent.length) * 100);
            }
            else if (strategy === 'even_odd') {
                const even = recent.filter(d => d % 2 === 0).length;
                pred = even > recent.length / 2 ? 'EVEN' : 'ODD';
                conf = Math.max(even, recent.length - even) / recent.length * 100;
            }
            else if (strategy === 'over_under') {
                const over = recent.filter(d => d > 5).length;
                pred = over > recent.length / 2 ? 'OVER 5' : 'UNDER 5';
                conf = Math.max(over, recent.length - over) / recent.length * 100;
            }

            predDigitDisp.innerText = pred;
            confidenceTxt.innerText = Math.round(conf) + '%';
            confidenceTxt.style.color = conf > 60 ? '#10b981' : '#f59e0b';
            analysisText.innerText = conf > 60 ? '✅ Strong Signal' : '⚠️ Weak Signal';
        }
    </script>
</body>
</html>
